services:
  app:
    image: ${APP_IMAGE:-sigap-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://sigap.bccdev.id
    volumes:
      - sigap_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sigap

  nginx:
    image: ${NGINX_IMAGE:-sigap-nginx:local}
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - sigap_storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - sigap

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sigap}
      MYSQL_USER: ${DB_USERNAME:-sigap_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - sigap_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sigap

  scheduler:
    image: ${APP_IMAGE:-sigap-app:local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://sigap.bccdev.id
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - sigap_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - sigap

volumes:
  sigap_db:
  sigap_storage:

networks:
  sigap:
    driver: bridge
