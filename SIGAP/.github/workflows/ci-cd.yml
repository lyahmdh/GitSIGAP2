name: SIGAP CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Laravel tests and frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, intl, zip, bcmath, exif, pcntl
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      - name: Install Node dependencies
        run: npm ci

      - name: Build React/Vite assets
        run: npm run build

  build-and-push:
    name: Build and push Docker images to GHCR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set SIGAP image namespace
        id: image
        run: echo "namespace=ghcr.io/lyahmdh/sigap" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.namespace }}-app:${{ github.sha }}
            ${{ steps.image.outputs.namespace }}-app:latest

      - name: Build and push Nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.namespace }}-nginx:${{ github.sha }}
            ${{ steps.image.outputs.namespace }}-nginx:latest

  deploy:
    name: Deploy to BCC VPS
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy directly on VPS
        env:
          IMAGE_TAG: latest
          APP_IMAGE: ghcr.io/lyahmdh/sigap-app
          NGINX_IMAGE: ghcr.io/lyahmdh/sigap-nginx
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

          cp deployment/docker-compose.yml /opt/sigap/deployment/docker-compose.yml
          cp scripts/deploy.sh /opt/sigap/scripts/deploy.sh
          chmod +x /opt/sigap/scripts/deploy.sh

          IMAGE_TAG="$IMAGE_TAG" \
          APP_IMAGE="$APP_IMAGE" \
          NGINX_IMAGE="$NGINX_IMAGE" \
          bash /opt/sigap/scripts/deploy.sh
