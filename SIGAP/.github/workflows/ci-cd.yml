name: SIGAP CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Laravel tests and frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, intl, zip, bcmath, exif, pcntl
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      - name: Install Node dependencies
        run: npm ci

      - name: Build React/Vite assets
        run: npm run build

  build-and-push:
    name: Build and push Docker images to GHCR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set SIGAP image namespace
        id: image
        run: echo "namespace=ghcr.io/lyahmdh/sigap" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.namespace }}-app:${{ github.sha }}
            ${{ steps.image.outputs.namespace }}-app:latest

      - name: Build and push Nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.namespace }}-nginx:${{ github.sha }}
            ${{ steps.image.outputs.namespace }}-nginx:latest

  deploy:
    name: Deploy to BCC VPS
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Trigger deployment on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_NAMESPACE: ghcr.io/lyahmdh/sigap
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p '$DEPLOY_PATH/deployment' '$DEPLOY_PATH/scripts'"
          scp deployment/docker-compose.yml "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/deployment/docker-compose.yml"
          scp scripts/deploy.sh "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/scripts/deploy.sh"
          printf '%s' "$GHCR_READ_TOKEN" | ssh "$VPS_USER@$VPS_HOST" "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin && cd '$DEPLOY_PATH' && IMAGE_TAG='$IMAGE_TAG' APP_IMAGE='$IMAGE_NAMESPACE-app' NGINX_IMAGE='$IMAGE_NAMESPACE-nginx' bash ./scripts/deploy.sh"